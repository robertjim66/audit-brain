# ============================================================
# 审计智脑 AuditBrain — OpenResty 反向代理样例
# 放置位置示例：/usr/local/openresty/nginx/conf/conf.d/audit-brain.conf
# 生效：openresty -t && openresty -s reload
#
# 上游：本机 Node（next start），端口取自 .env 的 PORT（默认 3003）
# 关键点：SSE 流式问答需关闭缓冲；解析/核对接口耗时长需放宽超时；上传需放开体积上限
# ============================================================

upstream audit_brain_upstream {
    server 127.0.0.1:3003;
    keepalive 32;                 # 复用后端长连接，降低握手开销
}

# HTTP -> HTTPS 跳转（纯内网/无域名可删除本段，仅保留下方 443）
server {
    listen 80;
    listen [::]:80;
    server_name audit.example.com;

    # Let's Encrypt 等签发校验用，可保留
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                     # 旧版 nginx 写法：listen 443 ssl http2;
    server_name audit.example.com;

    # ---------- 证书 ----------
    ssl_certificate     /etc/nginx/ssl/audit.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/audit.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 上传体积 ----------
    # 审计资料含扫描件/大 PDF，需放开（与前端提示保持一致）
    client_max_body_size 200m;
    client_body_timeout  600s;

    # ---------- 压缩 ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # ---------- 通用代理头 ----------
    # 注意：应用当前未消费 TRUST_PROXY / ALLOWED_ORIGINS，头部透传为后续启用预留
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";   # 配合 upstream keepalive，勿设 keep-alive
    proxy_connect_timeout 30s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # 若前端挂了 CDN/WAF，需按来源回填真实 IP：
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # ---------- 1. SSE 流式问答 ----------
    # fetch + ReadableStream 逐块读取，必须关闭所有缓冲，否则内容会积压到结束才吐
    location ^~ /api/audit/chat/ {
        proxy_pass http://audit_brain_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;                       # 避免压缩层二次缓冲
        proxy_set_header Connection ""; # 长连接下保持活跃，勿覆盖为 close
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        # 应用已返回 X-Accel-Buffering: no，此处为双保险
    }

    # ---------- 2. 长耗时接口 ----------
    # 文档解析（PaddleOCR-VL 轮询，OCR_TIMEOUT_MS 默认 600s）、批量解析、核对执行
    location ^~ /api/audit/documents/ {
        proxy_pass http://audit_brain_upstream;
        proxy_read_timeout 1800s;
        proxy_request_buffering off;    # 大文件直接流式透传后端
    }

    location ^~ /api/audit/checks/ {
        proxy_pass http://audit_brain_upstream;
        proxy_read_timeout 1800s;
    }

    # ---------- 3. 上传原件（审计敏感文件，禁止匿名直链） ----------
    # 应用侧已把 /uploads/* rewrite 到 /api/files/*（带鉴权）。这里再显式拦一道，
    # 避免代理层或应用升级期间出现绕过（哪怕 404 也不能返回文件内容）。
    location ^~ /uploads/ {
        return 404;
    }
    location ^~ /api/files/ {
        proxy_pass http://audit_brain_upstream;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # ---------- 4. Next 静态资源（内容哈希，可长期缓存） ----------
    location /_next/static/ {
        proxy_pass http://audit_brain_upstream;
        proxy_cache_valid 200 365d;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------- 5. 其余全部转发 ----------
    location / {
        proxy_pass http://audit_brain_upstream;
    }
}
